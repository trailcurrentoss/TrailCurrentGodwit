BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "rpi-cm5"
BBFILE_PATTERN_rpi-cm5 = "^${LAYERDIR}/"
BBFILE_PRIORITY_rpi-cm5 = "10"

# Without meta-godwit the layer holds only configuration and a .wks
BBFILE_PATTERN_IGNORE_EMPTY_rpi-cm5 = "1"

# Changes to the Godwit HMI, used only when meta-godwit is in the build
BBFILES_DYNAMIC += "godwit:${LAYERDIR}/dynamic-layers/godwit/recipes-*/*/*.bbappend"

LAYERDEPENDS_rpi-cm5 = "core raspberrypi"
LAYERSERIES_COMPAT_rpi-cm5 = "wrynose"
