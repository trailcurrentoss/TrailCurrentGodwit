# Sound comes and goes through a Creative Sound Blaster Play! 3 USB adapter:
# its headphone jack feeds the vehicle's amplifier and its microphone jack
# takes the cabin microphone. The Pi 5 has no analogue audio of its own, only
# HDMI sound cards, which AGL already ranks below any USB audio (1100 against
# 1300 for outputs, 2300 for inputs). Ranking the adapter above every other
# USB audio device as well keeps it the default output and the default
# microphone whatever else is plugged in: another USB microphone (a webcam's,
# say) would otherwise tie with it. The equalizer that carries the HMI's audio
# follows the default output, and godwit-mic (62-godwit-mic.conf), which the
# voice assistant listens to, follows the default microphone.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.*"
        api.alsa.card.name = "~.*Sound Blaster Play! 3.*"
      }
      {
        node.name = "~alsa_input.*"
        api.alsa.card.name = "~.*Sound Blaster Play! 3.*"
      }
    ]
    actions = {
      update-props = {
        priority.driver  = 3000
        priority.session = 3000
      }
    }
  }
]
