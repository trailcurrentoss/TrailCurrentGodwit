BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "rpi5-dsi"
BBFILE_PATTERN_rpi5-dsi = "^${LAYERDIR}/"
BBFILE_PRIORITY_rpi5-dsi = "10"

# Without meta-godwit the layer holds only configuration
BBFILE_PATTERN_IGNORE_EMPTY_rpi5-dsi = "1"

# Changes to the Godwit HMI, used only when meta-godwit is in the build
BBFILES_DYNAMIC += "godwit:${LAYERDIR}/dynamic-layers/godwit/recipes-*/*/*.bbappend"

LAYERDEPENDS_rpi5-dsi = "core raspberrypi"
LAYERSERIES_COMPAT_rpi5-dsi = "wrynose"
