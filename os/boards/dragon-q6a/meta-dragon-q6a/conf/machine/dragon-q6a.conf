#@TYPE: Machine
#@NAME: Radxa Dragon Q6A
#@DESCRIPTION: Radxa Dragon Q6A (Qualcomm QCS6490). Boots through the board's
#@  UEFI firmware in SPI NOR, which starts systemd-boot from the ESP; systemd-boot
#@  hands the kernel the board DTB.

DEFAULTTUNE = "armv8-2a-crypto"
require conf/machine/include/arm/arch-armv8-2a.inc

MACHINE_FEATURES = "alsa bluetooth efi ext2 keyboard pci rtc screen usbgadget usbhost vfat wifi"

PREFERRED_PROVIDER_virtual/kernel = "linux-radxa-qcom"
KERNEL_IMAGETYPE = "Image"
KERNEL_DEVICETREE = "qcom/qcs6490-radxa-dragon-q6a.dtb"
MACHINE_EXTRA_RRECOMMENDS += "kernel-modules"

# Landscape on HDMI (AGL defaults to a 90-degree portrait rotation)
WESTON_DISPLAYS = "hdmi-a-1-0"

# Debug UART (uart5, 40-pin header)
SERIAL_CONSOLES = "115200;ttyMSM0"

EFI_PROVIDER = "systemd-boot"
IMAGE_FSTYPES = "wic.zst wic.bmap"
WKS_FILE = "dragon-q6a.wks.in"
WKS_FILE_DEPENDS:append = " virtual/kernel"
# No boot menu delay (see classes/dragon-q6a-boot.bbclass)
IMAGE_CLASSES += "dragon-q6a-boot"
IMAGE_EFI_BOOT_FILES = ""

MACHINE_EXTRA_RRECOMMENDS += " \
    dragon-q6a-firmware \
    linux-firmware-qcom-adreno-a660 \
    linux-firmware-qcom-qcm6490-qupv3fw \
    linux-firmware-qcom-qcm6490-ipa \
    linux-firmware-qcom-qcs6490-radxa-dragon-q6a-audio \
    linux-firmware-qcom-qcs6490-radxa-dragon-q6a-compute \
    linux-firmware-qcom-vpu \
    linux-firmware-rtl-nic \
    aic8800-usb \
"
