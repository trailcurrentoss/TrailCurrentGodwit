BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "dragon-q6a"
BBFILE_PATTERN_dragon-q6a = "^${LAYERDIR}/"
BBFILE_PRIORITY_dragon-q6a = "10"

LAYERDEPENDS_dragon-q6a = "core"
LAYERSERIES_COMPAT_dragon-q6a = "wrynose"

# Changes to the Godwit HMI, used only when meta-godwit is in the build
BBFILES_DYNAMIC += "godwit:${LAYERDIR}/dynamic-layers/godwit/recipes-*/*/*.bbappend"
