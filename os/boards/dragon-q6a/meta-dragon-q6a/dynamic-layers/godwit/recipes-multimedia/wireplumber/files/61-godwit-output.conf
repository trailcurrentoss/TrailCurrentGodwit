# All sound goes to the 3.5 mm jack, which feeds the vehicle's amplifier. AGL
# ranks every USB output (1300) above the on-board codec (1000), so a USB
# speakerphone, headset or webcam would become the default output, and the
# equalizer that carries all of the HMI's audio follows the default. Ranking
# the jack above every other output keeps it the default whatever is plugged in.
monitor.alsa.rules = [
  # The UCM profile hands PipeWire the headphone amplifiers (HPHL, HPHR) as the
  # jack's hardware volume, so every WirePlumber start drove them to +6 dB,
  # which clips, over the -6 dB 70-godwit-audio.rules sets. Volume is software
  # only; the amplifiers stay where the rule puts them.
  {
    matches = [
      { device.name = "alsa_card.platform-sound" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_output.platform-sound.HiFi__Headphones__sink" }
    ]
    actions = {
      update-props = {
        priority.driver  = 3000
        priority.session = 3000
      }
    }
  }
]
