# Outputs start at full volume. WirePlumber's default is 0.064 (40% on its
# cubic scale, about -24 dB), and AGL's stateless setup applies it on every
# boot, which leaves the head unit quiet at any media volume. The HMI's
# per-role volumes (music, guidance, calls) are the only volume controls.
wireplumber.settings = {
  device.routes.default-sink-volume = 1.0
}
