# Outputs start at full volume. WirePlumber's default is 0.064 (40% on its
# cubic scale, about -24 dB), and AGL's stateless setup applies it on every
# boot, which leaves the head unit quiet at any media volume. The HMI's
# per-role volumes (music, guidance, calls) are the only volume controls.
#
# Microphones start 15 dB below full (0.178). WirePlumber's default for them
# is full, which on a USB webcam mic is +50 dB of gain: a voice at arm's length
# clips, and the clipped "Hey Peregrine" is not recognised by the wake word,
# with or without the processing in 62-godwit-mic.conf.
wireplumber.settings = {
  device.routes.default-sink-volume = 1.0
  device.routes.default-source-volume = 0.178
}
