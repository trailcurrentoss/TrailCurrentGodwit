# The microphone the voice assistant listens to ("godwit-mic"): whichever mic
# is the default, through WebRTC's processing, so a webcam's mic does the job
# of a speakerphone. Automatic gain evens out a near or far voice, noise
# suppression takes out fan and road noise, and what the head unit itself
# plays (guidance, music, the assistant's replies) is cancelled from it. The
# HMI's wake word and dictation use it through GODWIT_MIC.
wireplumber.profiles = {
  policy = {
    godwit.mic = required
  }
}

wireplumber.components = [
  {
    name = libpipewire-module-echo-cancel, type = pw-module
    arguments = {
      library.name = aec/libspa-aec-webrtc
      audio.channels = 1
      audio.position = [ MONO ]
      # The reference is the default output's monitor, so no sound has to be
      # routed through this module
      monitor.mode = true
      aec.args = {
        webrtc.high_pass_filter = true
        webrtc.noise_suppression = true
        webrtc.gain_control = true
        webrtc.voice_detection = false
      }
      capture.props = {
        node.name = "godwit-mic-capture"
        node.passive = true
      }
      source.props = {
        node.name = "godwit-mic"
        node.description = "Godwit microphone"
        # Never the default source: its own capture follows the default mic
        priority.session = 0
        priority.driver = 0
      }
    }
    provides = godwit.mic
    requires = [ pw.node-factory.adapter ]
    after = [ support.standard-event-source ]
  }
]
