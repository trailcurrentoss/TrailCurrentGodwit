<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- The HMI runs as "godwit" outside a login session, so ConnMan's, BlueZ's
     and oFono's own at_console rules do not cover it. Let it reach them, and
     let it run obexd on the system bus for the phone's contacts
     (godwit-obexd.service). -->
<busconfig>
    <policy user="godwit">
        <allow send_destination="net.connman"/>
        <allow send_destination="org.bluez"/>
        <allow send_destination="org.ofono"/>
        <allow own="org.bluez.obex"/>
        <allow send_destination="org.bluez.obex"/>
    </policy>
</busconfig>
