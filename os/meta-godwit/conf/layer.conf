BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "godwit"
BBFILE_PATTERN_godwit = "^${LAYERDIR}/"
BBFILE_PRIORITY_godwit = "10"

LAYERDEPENDS_godwit = "core qt6-layer"
LAYERSERIES_COMPAT_godwit = "wrynose"

# Top of the Godwit repository. The layer is symlinked into the AGL checkout,
# so resolve the link to reach hmi/ beside os/.
GODWIT_TOPDIR := "${@os.path.realpath(os.path.join(d.getVar('LAYERDIR'), '..', '..'))}"

# AGL gives every system user a fixed ID; these are Godwit's
USERADD_UID_TABLES:append = " files/godwit-passwd"
USERADD_GID_TABLES:append = " files/godwit-group"

# AGL's demo layer has an older MapLibre without the camera API the HMI uses
PREFERRED_VERSION_maplibre-native-qt ?= "4.0.0+git%"
